name: Worker Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions: {}

# Serialize updates and deletion so a close event cannot race an in-flight deploy.
concurrency:
  group: worker-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  PREVIEW_NAME: pr-${{ github.event.pull_request.number }}

jobs:
  deploy:
    name: Deploy preview
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      preview-url: ${{ steps.deploy.outputs.preview-url }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare deployment
        uses: ./.github/actions/prepare-deployment
        with:
          # Public Turnstile test site key, valid on any preview hostname.
          turnstile-site-key: 1x00000000000000000000AA

      - name: Generate preview session secret
        shell: bash
        run: |
          umask 077
          session_secret=$(openssl rand -hex 32)
          printf '{"SESSION_COOKIE_SECRET":"%s"}\n' "$session_secret" > "$RUNNER_TEMP/worker-preview-secrets.json"

      - name: Deploy Worker Preview
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/worker-preview-output.jsonl
        run: |
          pnpm exec wrangler preview \
            --name "$PREVIEW_NAME" \
            --ignore-base-config \
            --secrets-file "$RUNNER_TEMP/worker-preview-secrets.json" \
            --json
          preview_url=$(jq -ser '[.[] | select(.type == "preview")] | last | .preview_urls[0]' "$WRANGLER_OUTPUT_FILE_PATH")
          echo "preview-url=$preview_url" >> "$GITHUB_OUTPUT"
          printf '### Worker Preview\n\n[Open preview](%s)\n' "$preview_url" >> "$GITHUB_STEP_SUMMARY"

      - name: Probe frontend and Worker API
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.preview-url }}
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors \
            --max-time 30 "$PREVIEW_URL/" --output /dev/null
          curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors \
            --max-time 30 "$PREVIEW_URL/api/turnstile/verify" \
            --header 'Content-Type: application/json' \
            --data '{"token":"XXXX.DUMMY.TOKEN.XXXX"}' | jq -e '.success == true'

      - name: Remove temporary preview secrets
        if: always()
        run: rm -f "$RUNNER_TEMP/worker-preview-secrets.json"

  cleanup:
    name: Delete preview
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout base branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.base_ref }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Delete Worker Preview
        run: pnpm exec wrangler preview delete --name "$PREVIEW_NAME" --skip-confirmation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  comment:
    name: Update preview comment
    needs: [deploy, cleanup]
    if: >-
      always() &&
      (needs.deploy.result == 'success' || needs.cleanup.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write

    steps:
      - name: Update pull request preview URL
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PREVIEW_URL: ${{ needs.deploy.outputs.preview-url }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const marker = "<!-- nicorandompicker-worker-preview -->";
            const body = context.payload.action === "closed"
              ? `${marker}\nWorker Preview を削除しました。`
              : `${marker}\n[Worker Preview を開く](${process.env.PREVIEW_URL})\n\nPR 更新時に同じ URL へ再デプロイされます。Turnstile はテストモードです。`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const comment = comments.find((comment) =>
              comment.user?.login === "github-actions[bot]" &&
              comment.body?.includes(marker),
            );
            if (comment) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: comment.id, body });
            } else if (context.payload.action !== "closed") {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

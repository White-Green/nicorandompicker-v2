name: Prepare deployment
description: Build frontend assets and prepare the Rust/Wasm Worker build tools.

inputs:
  turnstile-site-key:
    description: Turnstile site key embedded in the frontend build.
    required: true

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24
        cache: pnpm

    - name: Setup Rust
      id: rust-toolchain
      uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
      with:
        toolchain: stable
        targets: wasm32-unknown-unknown

    - name: Cache Cargo dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
        key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

    - name: Install frontend dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Fetch Cargo dependencies
      shell: bash
      run: cargo fetch

    - name: Cache Rust target
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: target
        key: ${{ runner.os }}-production-target-${{ steps.rust-toolchain.outputs.cachekey }}-${{ hashFiles('Cargo.lock') }}

    - name: Resolve worker-build version
      id: worker-build-version
      shell: bash
      run: |
        VER=$(cargo metadata --no-deps --format-version 1 | jq -er '.packages[0].metadata["cargo-binaries"]["worker-build"]')
        echo "version=$VER" >> "$GITHUB_OUTPUT"
        echo "worker-build ${VER}"

    - name: Cache worker-build
      id: cache-worker-build
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/bin/worker-build
        key: ${{ runner.os }}-worker-build-${{ steps.worker-build-version.outputs.version }}

    - name: Install worker-build
      if: steps.cache-worker-build.outputs.cache-hit != 'true'
      shell: bash
      run: cargo install worker-build --version "$WORKER_BUILD_VERSION" --locked
      env:
        WORKER_BUILD_VERSION: ${{ steps.worker-build-version.outputs.version }}

    - name: Build frontend assets
      shell: bash
      run: pnpm build:frontend
      env:
        VITE_TURNSTILE_SITE_KEY: ${{ inputs.turnstile-site-key }}
